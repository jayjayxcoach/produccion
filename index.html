<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1A20">
<meta name="robots" content="noindex, nofollow">
<title>Producción</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#F6F2EE;--papel:#FFFFFF;--linea:#E7DFD8;--vino:#6B1A20;--vino-claro:#F4E6E7;--oro:#C9A36A;--tinta:#221A1C;--gris:#4A3F42;--gris2:#6B5E61;--verde:#2F7D4F;--ambar:#7A3F08;--ambar-claro:#FBEFD9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--vino)}
.oculto{display:none!important}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* Entrada */
#entrada{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#entrada form{width:100%;max-width:360px;background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
#entrada h1{margin:0;font-size:30px;color:var(--vino)}
#entrada p{margin:0;color:var(--gris);font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--gris)}
input[type=email],input[type=password]{min-height:48px;padding:0 14px;border:1px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);font-size:16px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--vino);background:var(--vino);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--vino)}
.btn.chico{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.error{color:#9B1C1C;font-size:14px;min-height:1em}

/* App */
#app{height:100%;display:flex;flex-direction:column}
header.barra{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--papel);border-bottom:1px solid var(--linea)}
.marca{display:flex;flex-direction:column;line-height:1.1}
.marca small{font-size:11px;color:var(--gris2);letter-spacing:.06em;text-transform:uppercase}
.marca b{font-size:22px;color:var(--vino)}
.acciones{display:flex;align-items:center;gap:8px}
.pastilla{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--linea);color:var(--gris)}
.punto{width:8px;height:8px;border-radius:999px;background:var(--gris2)}
.punto.vivo{background:var(--verde)}
.campana{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--linea);background:#fff;color:var(--vino);display:inline-flex;align-items:center;justify-content:center}
.contador{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--vino);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.campana .contador{position:absolute;top:-6px;right:-6px}

.cuerpo{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 380px}
.panel{min-height:0;overflow:auto}
#p-clientas{border-right:1px solid var(--linea);padding:12px 10px 24px}
#p-diseno{padding:16px 20px 32px}
#p-lado{border-left:1px solid var(--linea);background:var(--papel);display:flex;flex-direction:column;overflow:hidden}

.grupo{margin-bottom:14px}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris2)}
.clienta{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid var(--linea);background:#fff;color:var(--tinta);min-height:52px}
.clienta.sel{border-color:var(--vino);box-shadow:0 0 0 1px var(--vino) inset;background:var(--vino-claro)}
.clienta .nom{font-weight:700;font-size:15px;display:block}
.clienta .sub{font-size:12.5px;color:var(--gris);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.etiqueta{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ambar-claro);color:var(--ambar);white-space:nowrap}
.derecha{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.vacio{font-size:13px;color:var(--gris2);padding:4px 8px 8px}
.mas{background:none;border:none;color:var(--vino);font-weight:600;font-size:13px;padding:4px 8px;min-height:36px}

.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:18px;padding:18px;margin-bottom:14px}
.cab-clienta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cab-clienta h1{margin:2px 0 4px;font-size:34px;color:var(--vino);line-height:1.05}
.meta{font-size:13px;color:var(--gris)}
.pasos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.paso{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--gris2);text-align:center}
.paso i{font-style:normal;width:30px;height:30px;border-radius:999px;border:1px solid var(--linea);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--gris2)}
.paso.hecho i{background:var(--vino-claro);color:var(--vino);border-color:var(--vino-claro)}
.paso.ahora i{background:var(--vino);color:#fff;border-color:var(--vino)}
.paso.ahora{color:var(--vino);font-weight:700}
.fila{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
.fila:last-child{border-bottom:none}
.fila .k{width:120px;flex-shrink:0;color:var(--gris2);font-size:13px}
h2{margin:0 0 10px;font-size:17px}
.nota{font-size:13px;color:var(--gris);background:var(--fondo);border-radius:12px;padding:10px 12px}
.toca{background:var(--ambar-claro);border:1px solid #F0D9B0;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.toca b{color:var(--ambar)}
.toca .t{white-space:pre-wrap;font-size:14px;color:var(--gris)}

.pestanas{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--linea)}
.pestanas button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--linea);background:#fff;font-weight:700;color:var(--gris);font-size:13.5px}
.pestanas button.act{background:var(--vino-claro);color:var(--vino);border-color:var(--vino-claro)}
#chat{flex:1 1 auto;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FBF8F5}
.msg{max-width:86%;display:flex;flex-direction:column;gap:3px}
.msg .quien{font-size:11px;color:var(--gris2)}
.msg .burbuja{padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.in{align-self:flex-start}.msg.in .burbuja{background:#fff;border:1px solid var(--linea)}
.msg.out{align-self:flex-end;align-items:flex-end}.msg.out .burbuja{background:var(--vino-claro);color:#3A0F12}
.msg .media{font-weight:600;color:var(--vino)}
.dia{align-self:center;font-size:11px;color:var(--gris2);background:#fff;border:1px solid var(--linea);border-radius:999px;padding:3px 10px;margin:6px 0}
.pie-chat{padding:10px 12px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--gris2)}
#cambios{flex:1 1 auto;overflow:auto;padding:12px}

/* Panel de avisos */
#avisos{position:fixed;top:64px;right:12px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:0 18px 40px rgba(34,26,28,.18);z-index:20;padding:10px}
.aviso{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:12px;border:1px solid var(--linea);margin-bottom:8px;background:#fff;text-align:left;width:100%;color:var(--tinta)}
.aviso.hecho{opacity:.55}
.aviso .tit{font-weight:700;font-size:14px}
.aviso .txt{font-size:13px;color:var(--gris);white-space:pre-wrap;max-height:7.5em;overflow:hidden}
.aviso .hora{font-size:11px;color:var(--gris2)}
.aviso-acc{display:flex;gap:6px;margin-top:4px}

/* Aviso emergente: uno a la vez y discreto */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top));width:min(420px,calc(100vw - 20px));z-index:30;display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.98);box-shadow:0 10px 30px rgba(34,26,28,.2);border:1px solid var(--linea);text-align:left;color:var(--tinta)}
#toast .ico{width:38px;height:38px;flex-shrink:0;border-radius:10px;background:var(--vino);display:inline-flex;align-items:center;justify-content:center}
#toast .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
#toast .tx b{font-size:14px}
#toast .tx span{font-size:13px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.banda{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--vino-claro);color:#3A0F12;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}

nav.abajo{display:none}

/* Mesa de diseño (fase 2) */
.mesa-elegidos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.elegido{display:flex;flex-direction:column;gap:6px;margin:0}
.elegido .marco{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--fondo);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;color:var(--gris2);font-size:13px;text-align:center;padding:0}
.elegido .marco img{width:100%;height:100%;object-fit:cover;display:block}
.elegido figcaption{font-size:13px;color:var(--gris)}
.elegido figcaption b{color:var(--vino)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.foto{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--fondo);border:1px solid var(--linea);padding:0}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .chip{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(34,26,28,.75);color:#fff}
.muestras{display:flex;flex-wrap:wrap;gap:10px}
.muestra{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--gris)}
.muestra i{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.12);display:inline-block}
.lista-ficha{margin:0;padding:0;list-style:none}
.lista-ficha li{padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.lista-ficha li:last-child{border-bottom:none}
.lista-ficha li.falta{color:var(--ambar)}
.lista-ficha li.falta::before{content:'Falta';flex-shrink:0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ambar-claro);color:var(--ambar);margin-top:1px}
.lista-ficha li.hecho{color:var(--gris2);text-decoration:line-through}
.caja-check{width:18px;height:18px;flex-shrink:0;border-radius:5px;border:1.5px solid var(--gris2);margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.caja-check.si{background:var(--verde);border-color:var(--verde)}
.sub-mesa{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris2);margin:16px 0 8px}
.versiones a{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea);text-decoration:none;color:var(--tinta);font-size:14px}
.versiones a:last-child{border-bottom:none}
.versiones img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--fondo)}
.versiones .ico-doc{width:56px;height:56px;border-radius:10px;background:var(--vino-claro);color:var(--vino);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

/* Fotos de verdad en el chat */
.burbuja .adj{display:block;margin:-3px -6px 6px;border-radius:10px;overflow:hidden;max-width:240px;padding:0;border:none;background:none}
.burbuja .adj img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover}
.burbuja audio{display:block;width:230px;max-width:100%;margin-bottom:4px}
.burbuja .trans{display:block;font-size:12.5px;color:var(--gris);font-style:italic}

/* Instrucción para Vale */
.vale{border-top:1px solid var(--linea);padding:10px 12px max(10px,env(safe-area-inset-bottom));background:var(--papel);display:flex;flex-direction:column;gap:8px}
.vale label{font-size:12px}
.vale textarea{width:100%;min-height:64px;max-height:160px;resize:vertical;padding:10px 12px;border:1px solid var(--linea);border-radius:12px;font-size:15px;color:var(--tinta);background:#fff}
.vale .fila-vale{display:flex;gap:8px;align-items:center;justify-content:space-between}
.vale .ayuda{font-size:12px;color:var(--gris2)}
.orden{align-self:flex-end;max-width:86%;font-size:12.5px;background:#FFF7E8;border:1px dashed #E5C78F;color:var(--ambar);border-radius:12px;padding:7px 10px;white-space:pre-wrap}
.orden.lista{background:#EEF6F0;border-color:#B9D9C3;color:var(--verde)}
.orden.error{background:#FBEAEA;border-color:#E9B8B8;color:#9B1C1C}

/* Visor de foto */
#visor{position:fixed;inset:0;z-index:40;background:rgba(20,14,16,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#visor img,#visor video{max-width:100%;max-height:100%;border-radius:10px}
#visor button{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:999px;border:none;background:#fff;color:var(--vino);font-size:20px;font-weight:700}

@media (max-width: 900px){
  .cuerpo{display:block;position:relative}
  .panel,#p-lado{position:absolute;inset:0;display:none;border:none!important}
  body[data-panel=clientas] #p-clientas,
  body[data-panel=diseno] #p-diseno{display:block}
  body[data-panel=chat] #p-lado,
  body[data-panel=cambios] #p-lado{display:flex}
  body[data-panel=chat] .pestanas,body[data-panel=cambios] .pestanas{display:none}
  #p-diseno{padding:12px 12px 24px}
  .cab-clienta h1{font-size:28px}
  .pasos{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .paso .lb{display:none}
  .paso i{width:26px;height:26px}
  .clienta .sub{max-width:62vw}
  nav.abajo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid var(--linea);padding:6px 6px max(10px,env(safe-area-inset-bottom))}
  nav.abajo button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:48px;border-radius:12px;border:none;background:none;font-size:13px;font-weight:700;color:var(--gris)}
  nav.abajo button.act{background:var(--vino-claro);color:var(--vino)}
  .pastilla.sync{display:none}
}
</style>
</head>
<body data-panel="clientas">

<section id="entrada" class="oculto">
  <form id="f-entrada" autocomplete="on">
    <h1 class="serif">Producción</h1>
    <p>Invitaciones de Amor · entra con tu correo y la contraseña de JAY OS.</p>
    <label>Correo<input id="correo" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="clave" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="b-entrar">Entrar</button>
    <div class="error" id="e-entrada" role="alert"></div>
  </form>
</section>

<section id="app" class="oculto">
  <header class="barra">
    <div class="marca"><small>Invitaciones de Amor</small><b class="serif">Producción</b></div>
    <div class="acciones">
      <span class="pastilla sync" id="estado-vivo"><span class="punto" id="punto-vivo"></span><span id="txt-vivo">Conectando…</span></span>
      <button class="campana" id="b-campana" type="button" aria-label="Avisos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span class="contador oculto" id="n-campana">0</span>
      </button>
    </div>
  </header>

  <div id="avisos" class="oculto" role="dialog" aria-label="Avisos"></div>

  <div class="cuerpo">
    <nav class="panel" id="p-clientas" aria-label="Clientas por paso">
      <div id="banda-push"></div>
      <div id="lista"></div>
    </nav>
    <main class="panel" id="p-diseno"></main>
    <aside class="panel" id="p-lado" aria-label="Chat y cambios">
      <div class="pestanas">
        <button type="button" id="t-chat" class="act">Chat</button>
        <button type="button" id="t-cambios">Cambios <span class="contador oculto" id="n-cambios-t">0</span></button>
      </div>
      <div id="chat"></div>
      <form class="vale oculto" id="pie-chat" autocomplete="off">
        <label for="t-vale">Instrucción para Vale</label>
        <textarea id="t-vale" maxlength="1500" placeholder="Ej.: dile que su sobre ya está en diseño y pídele una foto de frente con buena luz"></textarea>
        <div class="fila-vale">
          <span class="ayuda">Vale se lo dice a la clienta con sus palabras. Tú no le escribes directo.</span>
          <button class="btn chico" type="submit" id="b-vale">Mandar a Vale</button>
        </div>
      </form>
      <div id="cambios" class="oculto"></div>
    </aside>
  </div>

  <nav class="abajo" aria-label="Secciones">
    <button type="button" data-ir="clientas" class="act">Clientas <span class="contador oculto" id="n-clientas">0</span></button>
    <button type="button" data-ir="diseno">Diseño</button>
    <button type="button" data-ir="chat">Chat <span class="contador oculto" id="n-chat">0</span></button>
    <button type="button" data-ir="cambios">Cambios <span class="contador oculto" id="n-cambios">0</span></button>
  </nav>
</section>

<div id="visor" class="oculto" role="dialog" aria-label="Archivo"><button type="button" id="b-visor" aria-label="Cerrar">×</button><div id="visor-in"></div></div>

<button id="toast" class="oculto" type="button">
  <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="#C9A36A" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9C1.2 8.9 3 5 6.6 5c2 0 3.4 1.1 4.4 2.6C12 6.1 13.4 5 15.4 5 19 5 20.8 8.9 19.3 12 17 16.6 12 21 12 21z"></path></svg></span>
  <span class="tx"><b id="toast-t"></b><span id="toast-x"></span></span>
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
// Datos públicos (como en JAY OS): la llave anon solo abre lo que las reglas (RLS) dejan a la cuenta de Jay.
const SUPA_URL = 'https://anoyfobghrmicpqsdkma.supabase.co';
const SUPA_ANON = 'sb_publishable_e4Q--M4Csqn7OEYd8iOu1Q_yj9mdEJL';
const VAPID_PUBLICA = 'BHR35EKHtTfpRixj3VyrRe1b_F9sJ1gNgMQflYzx9f5PqBie3uBwXw75wAlfHT-6AFZ8IAXfKPmVawRD6kGQmO4';
const PASOS = ['Con Vale', 'Eligió', 'Referencias', 'Variaciones', 'Documento', 'Ella elige', 'Invitación', 'Enviada'];
const PASOS_LARGO = ['Con Vale: pidiendo datos o eligiendo del catálogo', 'Eligió sobre, portada y colores', 'Referencias de Pinterest',
  'Variaciones de Gemini', 'Documento para la clienta', 'Ella elige su versión', 'Invitación', 'Enviada'];
const TOCA_DIAS = 3;

const sb = supabase.createClient(SUPA_URL, SUPA_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const E = { clientas: [], avisos: [], noLeidos: {}, sel: null, mensajes: [], lado: 'chat', verTodos: {}, canal: null,
  archivos: [], ordenes: [], catalogo: {} };
const URLS = {};   // ruta del bucket privado → enlace firmado (1 h)

function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of hijos.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function hora(iso) {
  if (!iso) return '';
  const d = new Date(iso), hoy = new Date();
  const hm = d.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === hoy.toDateString()) return hm;
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer ' + hm;
  return d.toLocaleDateString('es-EC', { day: 'numeric', month: 'short' }) + ' ' + hm;
}
function dia(iso) { return new Date(iso).toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long' }); }

// ---------- entrada ----------
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return mostrarEntrada();
  const { data, error } = await sb.from('prod_usuarios').select('user_id').limit(1);
  if (error || !data || !data.length) {
    await sb.auth.signOut();
    return mostrarEntrada('Esta cuenta no tiene acceso al tablero de producción.');
  }
  $('entrada').classList.add('oculto');
  $('app').classList.remove('oculto');
  await cargarTodo();
  escuchar();
  bandaPush();
  const m = location.hash.match(/c=([0-9a-f-]{36})/);
  if (m) elegir(m[1], true);
}
function mostrarEntrada(msg) {
  $('app').classList.add('oculto');
  $('entrada').classList.remove('oculto');
  $('e-entrada').textContent = msg || '';
}
$('f-entrada').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('b-entrar').disabled = true; $('e-entrada').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('correo').value.trim(), password: $('clave').value });
  $('b-entrar').disabled = false;
  if (error) return ($('e-entrada').textContent = 'No pude entrar: revisa el correo y la contraseña.');
  $('clave').value = '';
  iniciar();
});

// ---------- datos ----------
async function cargarTodo() {
  const desde = new Date(Date.now() - 45 * 864e5).toISOString();
  const [c, a, k] = await Promise.all([
    sb.from('prod_clientas').select('*').eq('oculta', false).gte('last_message_at', desde).order('last_message_at', { ascending: false }),
    sb.from('prod_avisos').select('*').order('creado', { ascending: false }).limit(60),
    sb.from('prod_archivos').select('ruta,nota').eq('tipo', 'catalogo').limit(200)
  ]);
  E.clientas = c.data || [];
  E.avisos = a.data || [];
  E.catalogo = {};
  for (const r of k.data || []) E.catalogo[r.ruta] = r.nota;
  await cargarNoLeidos();
  pintar();
}
async function cargarNoLeidos() {
  const { data } = await sb.rpc('prod_no_leidos');
  E.noLeidos = {};
  for (const r of data || []) E.noLeidos[r.cid] = Number(r.n);
  if (E.sel && E.noLeidos[E.sel]) marcarLeido(E.sel);
}
async function cargarChat(cid) {
  const { data } = await sb.from('prod_mensajes').select('*').eq('cid', cid).order('sent_at', { ascending: false }).limit(200);
  if (E.sel !== cid) return;
  E.mensajes = (data || []).reverse();
  pintarChat(true);
}
// ---------- archivos (bucket privado: enlaces firmados de 1 h) ----------
async function firmar(rutas) {
  const faltan = [...new Set(rutas.filter((r) => r && !(URLS[r] && URLS[r].exp > Date.now() + 120e3)))];
  for (let i = 0; i < faltan.length; i += 100) {
    const { data } = await sb.storage.from('produccion').createSignedUrls(faltan.slice(i, i + 100), 3600);
    for (const d of data || []) if (d.signedUrl) URLS[d.path] = { u: d.signedUrl, exp: Date.now() + 3600e3 };
  }
}
const enlace = (r) => (r && URLS[r] ? URLS[r].u : null);
async function cargarArchivos(cid) {
  const [a, o] = await Promise.all([
    sb.from('prod_archivos').select('*').eq('cid', cid).order('creado', { ascending: false }).limit(300),
    sb.from('prod_ordenes').select('*').eq('cid', cid).order('creada', { ascending: false }).limit(30)
  ]);
  if (E.sel !== cid) return;
  E.archivos = a.data || [];
  E.ordenes = (o.data || []).reverse();
  const c = E.clientas.find((x) => x.cid === cid);
  await firmar([...E.archivos.map((x) => x.miniatura || x.ruta), ...E.archivos.filter((x) => x.tipo === 'audio').map((x) => x.ruta),
    ...elegidos(c).map((x) => x.ruta)]);
  if (E.sel !== cid) return;
  pintarDiseno(); pintarChat(false);
}
// sobre y portada: la fila que dejó el sincronizador o, si todavía no hay, la imagen del catálogo por su código
function elegidos(c) {
  if (!c) return [];
  const out = [];
  for (const [tipo, re] of [['sobre', /\bS\d+\b/], ['portada', /\bP\d+\b/]]) {
    const fila = E.archivos.find((a) => a.tipo === tipo);
    const cod = (c.eleccion || '').match(re);
    if (fila) out.push(fila);
    else if (cod) out.push({ tipo, ruta: `catalogo/${cod[0]}.jpg`, nota: E.catalogo[`catalogo/${cod[0]}.jpg`] || cod[0] });
  }
  return out;
}
async function ver(a) {
  if (a.tipo === 'documento' || a.tipo === 'pdf' || /pdf/.test(a.mime || '')) {
    await firmar([a.ruta]); const u = enlace(a.ruta); if (u) window.open(u, '_blank', 'noopener'); return;
  }
  await firmar([a.ruta]);
  const u = enlace(a.ruta); if (!u) return;
  const esVideo = /^video\//.test(a.mime || '') || /\.(mp4|mov|3gp)$/i.test(a.ruta);
  $('visor-in').replaceChildren(esVideo ? h('video', { src: u, controls: true, autoplay: true, playsinline: true }) : h('img', { src: u, alt: a.nota || 'Archivo' }));
  $('visor').classList.remove('oculto');
}
$('b-visor').addEventListener('click', () => { $('visor').classList.add('oculto'); $('visor-in').replaceChildren(); });

async function marcarLeido(cid) {
  delete E.noLeidos[cid];
  await sb.from('prod_lecturas').upsert({ cid, leido_hasta: new Date().toISOString() });
  pintarContadores(); pintarLista();
}
function tocaDe(cid) {
  const lim = Date.now() - TOCA_DIAS * 864e5;

function esCambio(a) { return /cambio/i.test((a.titulo || '') + ' ' + (a.texto || '').slice(0, 60)); }

// ---------- en vivo ----------
function escuchar() {
  if (E.canal) sb.removeChannel(E.canal);
  E.canal = sb.channel('produccion')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prod_clientas' }, (p) => {
      const n = p.new;
      if (!n || !n.cid) return;
      const i = E.clientas.findIndex((x) => x.cid === n.cid);
      if (n.oculta) { if (i >= 0) E.clientas.splice(i, 1); }
      else if (i >= 0) E.clientas[i] = n; else E.clientas.unshift(n);
      E.clientas.sort((a, b) => (b.last_message_at || '').localeCompare(a.last_message_at || ''));
      pintarLista(); if (E.sel === n.cid) pintarDiseno();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'prod_mensajes' }, (p) => {
      const m = p.new;
      if (m.cid === E.sel) {
        if (!E.mensajes.some((x) => x.id === m.id)) { E.mensajes.push(m); E.mensajes.sort((a, b) => (a.sent_at || '').localeCompare(b.sent_at || '')); }
        pintarChat(false);
      }
      if (m.direction === 'inbound') {
        const viendo = m.cid === E.sel && document.visibilityState === 'visible' && (innerWidth > 900 || document.body.dataset.panel === 'chat');
        if (viendo) marcarLeido(m.cid);
        else { E.noLeidos[m.cid] = (E.noLeidos[m.cid] || 0) + 1; pintarContadores(); pintarLista(); }
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prod_archivos' }, (p) => {
      const a = p.new; if (!a) return;
      if (a.tipo === 'catalogo') E.catalogo[a.ruta] = a.nota;
      if (E.sel && (a.cid === E.sel || a.tipo === 'catalogo')) cargarArchivos(E.sel);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prod_ordenes' }, (p) => {
      const o = p.new; if (!o || o.cid !== E.sel) return;
      const i = E.ordenes.findIndex((x) => x.id === o.id);
      if (i >= 0) E.ordenes[i] = o; else E.ordenes.push(o);
      pintarChat(false);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prod_avisos' }, (p) => {
      const a = p.new; if (!a || !a.id) return;
      const i = E.avisos.findIndex((x) => x.id === a.id);
      if (i >= 0) E.avisos[i] = a; else { E.avisos.unshift(a); if (a.suena) toast(a); }
      pintarContadores(); pintarLista(); pintarAvisos(); pintarCambios(); if (E.sel) pintarDiseno();
    })
    .subscribe((estado) => {
      const vivo = estado === 'SUBSCRIBED';
      $('punto-vivo').classList.toggle('vivo', vivo);
      $('txt-vivo').textContent = vivo ? 'En vivo' : 'Reconectando…';
      if (vivo) cargarNoLeidos().then(pintar);
    });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('app').classList.contains('oculto')) {
    cargarTodo(); if (E.sel) { cargarChat(E.sel); cargarArchivos(E.sel); }
  }
});

// ---------- pintar ----------
function pintar() { pintarLista(); pintarContadores(); pintarAvisos(); pintarCambios(); if (E.sel) pintarDiseno(); else pintarDisenoVacio(); }

function pintarLista() {
  const cont = $('lista'); cont.replaceChildren();
  // Arriba las que esperan algo de Jay; luego los pasos 1 → 7; al final las que siguen con Vale.
  const tocan = E.clientas.filter((c) => tocaDe(c.cid).length);
  if (tocan.length) {
    const g = h('div', { class: 'grupo' }, h('div', { class: 'grupo-cab' }, h('span', {}, 'Te toca'), h('span', {}, tocan.length)));
    for (const c of tocan) g.append(filaClienta(c));
    cont.append(g);
  }
  for (const p of [1, 2, 3, 4, 5, 6, 7, 0]) {
    const items = E.clientas.filter((c) => (c.paso || 0) === p && !tocaDe(c.cid).length);
    if (!items.length) continue;
    const limite = p === 0 && !E.verTodos[p] ? 8 : 999;
    const g = h('div', { class: 'grupo' },
      h('div', { class: 'grupo-cab' }, h('span', {}, `${p} · ${PASOS[p]}`), h('span', {}, items.length || '')));
    for (const c of items.slice(0, limite)) g.append(filaClienta(c));
    if (items.length > limite) g.append(h('button', { class: 'mas', type: 'button', onclick: () => { E.verTodos[p] = true; pintarLista(); } }, `Ver ${items.length - limite} más`));

}

function pintarContadores() {
  const sinVer = E.avisos.filter((a) => !a.atendido && new Date(a.creado).getTime() > Date.now() - TOCA_DIAS * 864e5);
  const cambios = sinVer.filter(esCambio).length;

  const pon = (id, n) => { const el = $(id); el.textContent = n; el.classList.toggle('oculto', !n); };

const COLORES = [['palo de rosa', '#E3B5B8'], ['rosa palo', '#E3B5B8'], ['rosa pastel', '#F6C6D6'], ['rosa gold', '#D9A68C'], ['oro rosa', '#D9A68C'],

  ['rosa', '#F2A7C0'], ['lila', '#C8A2D8'], ['lavanda', '#B9A6E0'], ['morado', '#7E4A9E'], ['violeta', '#8A4FBF'], ['púrpura', '#6E2A8C'],

function muestras(texto) {
  let t = ' ' + (texto || '').toLowerCase() + ' ';
  const out = [];

    const i = t.indexOf(nom);
    if (i < 0 || /[a-záéíóúñ]/.test(t[i - 1]) || /[a-záéíóúñ]/.test(t[i + nom.length] || ' ')) continue;
    out.push([i, nom, hex]); t = t.slice(0, i) + ' '.repeat(nom.length) + t.slice(i + nom.length);

const sinMd = (s) => String(s || '').replace(/\*\*|`/g, '');

  // 4. versiones y PDF (subidos desde la Intel o la Ryzen7 con tablero.py subir)

        h('span', {}, h('b', {}, a.nota || a.ruta.split('/').pop()), h('br'), h('span', { class: 'meta' }, hora(a.creado))));
    })));
  }
  // 5. datos del evento, con lo que falta marcado

  t.append(h('div', { class: 'sub-mesa' }, 'Datos del evento'));
  if (datos.length) t.append(h('ul', { class: 'lista-ficha' }, ...datos.map((d) => h('li', { class: FALTA.test(d) ? 'falta' : null }, h('span', {}, d)))));
  else t.append(h('p', { class: 'meta', style: 'margin:0' }, c.carpeta ? 'La ficha no tiene datos todavía.' : 'Sin ficha todavía: Vale está pidiendo los datos.'));
  // 6. pedidos de la ficha (pendientes primero)
  const ped = [...(c.pedidos || [])].sort((a, b) => a.hecho - b.hecho);
  if (ped.length) {
    t.append(h('div', { class: 'sub-mesa' }, `Pedidos (${ped.filter((p) => !p.hecho).length} pendientes)`),
      h('ul', { class: 'lista-ficha' }, ...ped.map((p) => h('li', { class: p.hecho ? 'hecho' : null },
        h('span', { class: 'caja-check' + (p.hecho ? ' si' : ''), 'aria-hidden': 'true' }, p.hecho ? '✓' : ''), h('span', {}, sinMd(p.texto))))));
  }
  return t;
}

function pintarChat(abajo) {
  const box = $('chat');
  const cerca = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.replaceChildren();
  if (!E.sel) { box.append(h('div', { class: 'vacio' }, 'Elige una clienta para ver su chat.')); return; }
  const cs = E.clientas.find((x) => x.cid === E.sel);
  if (cs) box.append(h('div', { class: 'dia', style: 'position:sticky;top:0;font-weight:700;color:var(--vino);z-index:1' }, 'Chat · ' + (cs.nombre || '') + (cs.contacto ? ' (' + cs.contacto + ')' : '')));
  if (!E.mensajes.length) box.append(h('div', { class: 'vacio' }, 'Sin mensajes todavía.'));
  const porMsg = {};
  for (const a of E.archivos) if (a.msg_id) porMsg[a.msg_id] = a;
  // mensajes e instrucciones para Vale, en orden
  const items = [...E.mensajes.map((m) => ({ t: m.sent_at || '', m })), ...E.ordenes.map((o) => ({ t: o.creada || '', o }))]
    .sort((a, b) => a.t.localeCompare(b.t));
  let ultDia = '';
  for (const it of items) {
    const d = it.t ? new Date(it.t).toDateString() : '';
    if (d && d !== ultDia) { box.append(h('div', { class: 'dia' }, dia(it.t))); ultDia = d; }
    if (it.o) { box.append(burbujaOrden(it.o)); continue; }
    const m = it.m;
    const c = E.clientas.find((x) => x.cid === m.cid);
    const autor = m.direction === 'inbound' ? (c && (c.contacto || c.nombre)) || 'Clienta' : m.autor;
    let cuerpo = m.body || '';
    let media = null;
    const mm = cuerpo.match(/^\[(Foto|Nota de voz|Video|Documento|Sticker|[a-z]+)\]\s?/);
    if (m.media && mm) {
      cuerpo = cuerpo.slice(mm[0].length);
      media = adjunto(porMsg[m.id]) || h('span', { class: 'media' }, mm[1] + (cuerpo ? ' · ' : ''));
    }
    box.append(h('div', { class: 'msg ' + (m.direction === 'inbound' ? 'in' : 'out') },
      h('span', { class: 'quien' }, `${autor} · ${hora(m.sent_at)}`),
      h('div', { class: 'burbuja' }, media, cuerpo)));
  }
  $('pie-chat').classList.toggle('oculto', !E.sel || E.lado !== 'chat');
  if (abajo || cerca) box.scrollTop = box.scrollHeight;
}
function adjunto(a) {
  if (!a) return null;
  const mini = enlace(a.miniatura || a.ruta);
  if (a.tipo === 'foto' && mini) return h('button', { type: 'button', class: 'adj', onclick: () => ver(a), 'aria-label': 'Ver foto' }, h('img', { src: mini, alt: 'Foto que mandó', loading: 'lazy' }));
  if (a.tipo === 'video' && mini) return h('span', {}, h('button', { type: 'button', class: 'adj', onclick: () => ver(a), 'aria-label': 'Ver video' }, h('img', { src: mini, alt: 'Video (12 cuadros)', loading: 'lazy' })),
    a.nota ? h('span', { class: 'trans' }, a.nota) : null);
  if (a.tipo === 'audio' && enlace(a.ruta)) {
    const dice = (a.nota || '').match(/Dice: «([\s\S]*)»/);
    return h('span', {}, h('audio', { src: enlace(a.ruta), controls: true, preload: 'none' }), h('span', { class: 'trans' }, dice ? '«' + dice[1] + '»' : (a.nota || '')));
  }
  if (a.tipo === 'documento') return h('a', { href: '#', class: 'media', onclick: (ev) => { ev.preventDefault(); ver(a); } }, 'Abrir documento');
  return null;
}
function burbujaOrden(o) {
  const est = { nueva: 'Enviando a Vale…', tomada: 'Vale lo está recibiendo…', avance: o.avance || 'En camino…', lista: o.avance || 'Vale ya lo tiene', error: o.avance || 'No llegó a Vale' }[o.estado] || o.estado;
  return h('div', { class: 'orden' + (o.estado === 'lista' ? ' lista' : o.estado === 'error' ? ' error' : '') },
    h('b', {}, 'Para Vale · ' + hora(o.creada)), '\n', (o.datos && o.datos.texto) || '', '\n— ', est);
}

$('pie-chat').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const texto = $('t-vale').value.trim();
  const c = E.clientas.find((x) => x.cid === E.sel);
  if (!texto || !c) return;
  if (!confirm(`¿Mandar esta instrucción a Vale para ${c.nombre || 'esta clienta'}?\n\n«${texto}»\n\nVale se lo dice a la clienta con sus palabras.`)) return;
  $('b-vale').disabled = true;
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from('prod_ordenes').insert({ cid: c.cid, tipo: 'aviso_vale', datos: { texto }, user_id: user && user.id }).select().single();
  $('b-vale').disabled = false;
  if (error) return alert('No se pudo mandar a Vale: ' + error.message);
  $('t-vale').value = '';
  if (!E.ordenes.some((x) => x.id === data.id)) E.ordenes.push(data);
  pintarChat(true);
  toast({ titulo: 'Instrucción enviada a Vale', texto: 'Le escribe a ' + (c.nombre || 'la clienta') + ' en unos segundos.' });
});

function pintarAvisos() {
  const box = $('avisos'); box.replaceChildren(h('h2', { style: 'padding:4px 6px' }, 'Avisos'));
  if (!E.avisos.length) box.append(h('div', { class: 'vacio' }, 'Sin avisos todavía.'));
  for (const a of E.avisos.slice(0, 40)) box.append(tarjetaAviso(a));
}
function tarjetaAviso(a) {
  const c = a.cid && E.clientas.find((x) => x.cid === a.cid);
  return h('div', { class: 'aviso' + (a.atendido ? ' hecho' : '') },
    h('span', { class: 'tit' }, a.titulo), h('span', { class: 'txt' }, a.texto),
    h('span', { class: 'hora' }, [hora(a.creado), c ? c.nombre : null].filter(Boolean).join(' · ')),
    h('div', { class: 'aviso-acc' },
      c ? h('button', { class: 'btn chico sec', type: 'button', onclick: () => { $('avisos').classList.add('oculto'); elegir(c.cid); } }, 'Abrir') : null,
      !a.atendido ? h('button', { class: 'btn chico sec', type: 'button', onclick: () => atender(a.id) }, 'Listo') : null));
}
function pintarCambios() {
  const box = $('cambios'); box.replaceChildren(
    h('p', { class: 'nota' }, 'Lo que las clientas piden después del diseño (música, fotos, ubicación, horarios). Hoy llegan por los avisos de Vale; en la fase 3 se aplican desde aquí.'));
  const lista = E.avisos.filter(esCambio);
  if (!lista.length) box.append(h('div', { class: 'vacio' }, 'Sin cambios pedidos.'));
  for (const a of lista) box.append(tarjetaAviso(a));
}

async function atender(id) {
  const a = E.avisos.find((x) => x.id === id); if (a) a.atendido = true;
  pintarContadores(); pintarLista(); pintarAvisos(); pintarCambios(); if (E.sel) pintarDiseno();
  await sb.from('prod_avisos').update({ atendido: true }).eq('id', id);
}

function elegir(cid, desdeAviso) {
  E.sel = cid; E.mensajes = []; E.archivos = []; E.ordenes = [];
  history.replaceState(null, '', '#c=' + cid);
  pintarLista(); pintarDiseno(); pintarChat(true); cargarChat(cid); cargarArchivos(cid);
  if (E.noLeidos[cid]) marcarLeido(cid);
  if (innerWidth <= 900) ir(desdeAviso ? 'diseno' : 'diseno');
  pintarContadores();
}

// ---------- navegación ----------
function ir(panel) {
  document.body.dataset.panel = panel;
  document.querySelectorAll('nav.abajo button').forEach((b) => b.classList.toggle('act', b.dataset.ir === panel));
  if (panel === 'chat' || panel === 'cambios') verLado(panel);
  if (panel === 'chat' && E.sel && E.noLeidos[E.sel]) marcarLeido(E.sel);
  pintarContadores();
}
document.querySelectorAll('nav.abajo button').forEach((b) => b.addEventListener('click', () => ir(b.dataset.ir)));
function verLado(cual) {
  E.lado = cual;
  $('t-chat').classList.toggle('act', cual === 'chat'); $('t-cambios').classList.toggle('act', cual === 'cambios');
  $('chat').classList.toggle('oculto', cual !== 'chat'); $('pie-chat').classList.toggle('oculto', cual !== 'chat' || !E.sel);
  $('cambios').classList.toggle('oculto', cual !== 'cambios');
  if (cual === 'chat') pintarChat(true);
}
$('t-chat').addEventListener('click', () => verLado('chat'));
$('t-cambios').addEventListener('click', () => verLado('cambios'));
$('b-campana').addEventListener('click', (ev) => { ev.stopPropagation(); $('avisos').classList.toggle('oculto'); });
document.addEventListener('click', (ev) => { if (!$('avisos').contains(ev.target)) $('avisos').classList.add('oculto'); });

// ---------- aviso emergente: uno a la vez ----------
let toastTimer = null;
function toast(a) {
  const c = a.cid && E.clientas.find((x) => x.cid === a.cid);
  $('toast-t').textContent = a.titulo.startsWith('Te toca') ? a.titulo : (c ? 'Te toca · ' + c.nombre : a.titulo);
  $('toast-x').textContent = (a.texto || '').split('\n')[0];
  const t = $('toast'); t.classList.remove('oculto');
  t.onclick = () => { t.classList.add('oculto'); if (c) elegir(c.cid); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('oculto'), 6000);
}

// ---------- push e instalación ----------
let pedirInstalar = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedirInstalar = e; bandaPush(); });
function b64(u) { const p = '='.repeat((4 - (u.length % 4)) % 4); const s = atob((u + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, (ch) => ch.charCodeAt(0)); }
async function bandaPush() {
  const box = $('banda-push'); box.replaceChildren();
  if (pedirInstalar) box.append(h('div', { class: 'banda' }, h('span', {}, 'Instala la app en este teléfono.'),
    h('button', { class: 'btn chico', type: 'button', onclick: async () => { pedirInstalar.prompt(); await pedirInstalar.userChoice; pedirInstalar = null; bandaPush(); } }, 'Instalar')));
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  eco('app-abierta', 'permiso=' + Notification.permission + ' sub=' + (sub ? sub.endpoint.slice(-12) : 'no') +
    ' sw=' + (reg.active ? 'si' : 'no') + ' instalada=' + matchMedia('(display-mode: standalone)').matches + ' ' + navigator.userAgent.slice(0, 120));
  if (sub && Notification.permission === 'granted') {
    guardarSub(sub);
    box.append(h('div', { class: 'banda' }, h('span', {}, 'Avisos activados en este teléfono.'),
      h('button', { class: 'btn chico sec', type: 'button', onclick: probarAviso }, 'Probar aviso')));
    return;
  }
  if (Notification.permission === 'denied') {
    box.append(h('div', { class: 'banda' }, h('span', {}, 'Los avisos están bloqueados. Actívalos en los permisos del sitio (candado junto a la dirección).')));
    return;
  }
  box.append(h('div', { class: 'banda' }, h('span', {}, 'Activa los avisos "te toca" en este teléfono.'),
    h('button', { class: 'btn chico', type: 'button', onclick: activarPush }, 'Activar avisos')));
}
async function activarPush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return bandaPush();
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLICA) });
    await guardarSub(sub);
    bandaPush();
    probarAviso();
  } catch (e) { alert('No pude activar los avisos: ' + e.message); }
}
// Muestra un aviso en la barra del teléfono sin pasar por el servidor (para saber si el teléfono lo deja salir).
async function probarAviso() {
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Te toca · prueba', {
      body: 'Así se ven los avisos del tablero en tu barra.', icon: '/icono-192.png', badge: '/icono-barra.png',
      tag: 'prueba-local', renotify: true, vibrate: [200, 100, 200], data: { url: '/' }
    });
    const ns = await reg.getNotifications();
    eco('prueba-local', 'ok en_barra=' + ns.length + ' permiso=' + Notification.permission);
    toast({ titulo: 'Aviso de prueba enviado', texto: 'Baja la barra de notificaciones para verlo.' });
  } catch (e) { eco('prueba-local', 'error ' + e.message); alert('El teléfono no dejó mostrar el aviso: ' + e.message); }
}
function eco(evento, detalle) { sb.rpc('prod_eco_anotar', { evento, detalle: String(detalle || '').slice(0, 300) }).then(() => {}, () => {}); }
async function guardarSub(sub) {
  const j = sub.toJSON();
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('prod_suscripciones').upsert({ endpoint: j.endpoint, user_id: user.id, p256dh: j.keys.p256dh, auth: j.keys.auth,
    dispositivo: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '' });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const m = e.data && e.data.abrir && e.data.abrir.match(/c=([0-9a-f-]{36})/);
    if (m) elegir(m[1], true);
  });
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') mostrarEntrada(); });
iniciar();
</script>
